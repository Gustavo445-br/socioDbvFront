@if (isOpen()) {
  <div class="modal" role="dialog" aria-modal="true" [attr.aria-labelledby]="title() ? 'modal-title' : null">
    <!-- Backdrop -->
    <div 
      class="modal__backdrop"
      (click)="handleBackdropClick($event)"
      aria-hidden="true"
    ></div>

    <!-- Modal Content -->
    <div 
      class="modal__dialog"
      [class.modal__dialog--sm]="size() === 'sm'"
      [class.modal__dialog--md]="size() === 'md'"
      [class.modal__dialog--lg]="size() === 'lg'"
      [class.modal__dialog--xl]="size() === 'xl'"
      [class.modal--open]="isOpen()"
    >
      <div class="modal__content">
        <!-- Header -->
        @if (title() || showCloseButton()) {
          <div class="modal__header">
            @if (title()) {
              <h2 id="modal-title" class="modal__title">{{ title() }}</h2>
            }
            @if (showCloseButton()) {
              <button
                type="button"
                class="modal__close-button"
                (click)="handleClose()"
                aria-label="Fechar modal"
              >
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="18" y1="6" x2="6" y2="18"></line>
                  <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
              </button>
            }
          </div>
        }

        <!-- Body -->
        <div class="modal__body">
          <ng-content></ng-content>
        </div>

        <!-- Footer -->
        <div class="modal__footer">
          <ng-content select="[slot='footer']"></ng-content>
        </div>
      </div>
    </div>
  </div>
}
