<app-layout-container>
    <!-- Header -->
    <app-top-menu slot="header" [appName]="title()" [navLinks]="navLinks()" [user]="userData()"
        [userMenuItems]="userMenuItems()" [notifications]="notifications()" />

<!-- Main Content -->
<div class="welcome-section">
  
    
    <!-- Router Outlet for routing -->
    <router-outlet />
</div>

<!-- Footer -->
<div slot="footer">
    <p>&copy; 2026 {{ title() }}. Todos os direitos reservados.</p>
</div>
</app-layout-container>

<!-- Modal Components (rendered based on service state) -->
<app-confirm-modal />
<app-alert-modal />
